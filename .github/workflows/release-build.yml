name: Release Build（打 tag 出 arm64 安装包）

# 用途：在 GitHub 的 Ubuntu runner 上出 release 包，省得本地硬扛 R8 / 装 Android SDK。
# 触发：推 `v*` tag（如 `v0.1.5`）自动跑；也可以在 Actions 里手动 workflow_dispatch（只构建、不发 Release）。
# 产物：arm64-v8a 一个包，资产名 `trackr-<versionName>-arm64-v8a.apk` —— 与
#       .github/scripts/update_metadata.py 和应用内 `UpdateInfo.pickDownloadUrl()` 的取包规则一致。
#
# 签名：在仓库 Secrets 里配好下面四项就会签名，否则产出 `-unsigned` 包并在 Release 正文里写明。
#   RELEASE_STORE_FILE_B64    keystore 文件的 base64（`base64 -w0 trackr-release.jks`）
#   RELEASE_STORE_PASSWORD    库口令
#   RELEASE_KEY_ALIAS         别名
#   RELEASE_KEY_PASSWORD      别名口令
# 不换 keystore 就不能覆盖安装上一版：换签名前必须先卸载旧包，所以这把 key 要么进 Secrets，要么自己本地签。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_only:
        description: '只构建，不创建 / 不更新 Release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 构建并上传 release 包
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 接受许可并装上 compileSdk 需要的平台
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          # build-logic 里 COMPILE_SDK = 37；platforms 用带小版本号的包名
          sdkmanager "platform-tools" "build-tools;37.0.0" "platforms;android-37.0" >/dev/null

      - name: Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'build-logic/**') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: 读版本号（取自 androidApp/build.gradle.kts，避免 tag 和包里写的不一致）
        id: ver
        run: |
          name=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' androidApp/build.gradle.kts | head -1)
          code=$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*=\([[:space:]]*\)\([0-9]\+\).*/\2/p' androidApp/build.gradle.kts | head -1)
          echo "version_name=$name" >> "$GITHUB_OUTPUT"
          echo "version_code=$code" >> "$GITHUB_OUTPUT"
          echo "versionName = $name / versionCode = $code"

      - name: 准备 keystore（有 Secrets 才签名）
        id: sign
        env:
          STORE_B64: ${{ secrets.RELEASE_STORE_FILE_B64 }}
        run: |
          if [ -z "$STORE_B64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "没配 RELEASE_STORE_FILE_B64，这轮出自签名包"
            exit 0
          fi
          printf '%s' "$STORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "signed=true"
            echo "store_file=$RUNNER_TEMP/release.jks"
          } >> "$GITHUB_OUTPUT"

      # lintVital 会额外占一大块内存 / 时间；先不跑它，要保证发布前静态体检就在本地或另开 workflow 跑全量 test。
      - name: Assemble release
        env:
          RELEASE_STORE_FILE: ${{ steps.sign.outputs.store_file }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: >-
          ./gradlew :androidApp:assembleRelease
          -x :androidApp:lintVitalAnalyzeRelease -x :androidApp:lintVitalRelease
          --no-daemon --stacktrace

      - name: 归一化资产名（trackr-<版本>-arm64-v8a.apk）
        id: apk
        run: |
          src=$(ls androidApp/build/outputs/apk/release/*arm64-v8a*.apk | head -1)
          out="trackr-${{ steps.ver.outputs.version_name }}-arm64-v8a.apk"
          case "$src" in *-unsigned.apk) out="trackr-${{ steps.ver.outputs.version_name }}-arm64-v8a-unsigned.apk";; esac
          cp "$src" "$out"
          ls -la "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"
          echo "signed_name=$out" >> "$GITHUB_OUTPUT"
          /usr/local/lib/android/sdk/build-tools/37.0.0/apksigner verify --print-certs "$out" 2>/dev/null | head -4 || true

      # 没配签名 Secrets 时产出的是未签名包：装上会失败，所以绝不往公开 Release 上丢，
      # 只挂到 Actions 运行页给人核对包体；要发版就去仓库里配齐那四项 Secrets 后重跑本 workflow。
      - name: 未签名 → 只上传 Actions 产物
        if: steps.sign.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.signed_name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: 已签名 → 建 / 更新 Release 并上传
        if: ${{ steps.sign.outputs.signed == 'true' && (github.event_name == 'push' || inputs.build_only == false) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME:-v${{ steps.ver.outputs.version_name }}}
          body="versionName ${{ steps.ver.outputs.version_name }} / versionCode ${{ steps.ver.outputs.version_code }}，arm64-v8a 单包。"
          if [ "${{ steps.sign.outputs.signed }}" != "true" ]; then
            fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes "$body"
            gh release upload "$tag" "${{ steps.apk.outputs.path }}" --clobber
          else
            gh release create "$tag" "${{ steps.apk.outputs.path }}" --title "Trackr $tag" --notes "$body"
          fi
          # 之后 .github/workflows/update-branch.yml 会在 release: published 上同步 update.json / version.json

      - name: 没签名时给人一句提醒
        if: steps.sign.outputs.signed != 'true'
        run: echo "::warning::未配置 RELEASE_STORE_FILE_B64 等签名 Secrets，本轮只上 Actions 产物（未签名包不能发 Release）"
